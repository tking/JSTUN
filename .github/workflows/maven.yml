name: Java CI with Maven

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Upload built JAR artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jstun-jars
        path: |
          target/jstun-*.jar
          !target/*-sources.jar
          !target/*-javadoc.jar
          !target/original-*.jar
    - name: Upload JaCoCo test coverage report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: target/site/jacoco/
    - name: Generate JaCoCo coverage badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: target/site/jacoco/jacoco.csv
        badges-directory: ${{ runner.temp }}/badges-out
        coverage-badge-filename: jacoco.svg
    - name: Publish JaCoCo badge to badges branch
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
          git fetch origin badges
          git checkout -B badges origin/badges
        else
          git checkout --orphan badges
          git rm -rf . >/dev/null 2>&1 || true
        fi
        cp "${{ runner.temp }}/badges-out/jacoco.svg" jacoco.svg
        git add jacoco.svg
        if ! git diff --cached --quiet; then
          git commit -m "chore: update JaCoCo coverage badge"
          git push origin badges
        fi
